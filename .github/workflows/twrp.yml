name: Compile Custom TWRP for Xiaomi 15 (dada)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/swift /usr/share/rust /usr/local/share/phantomjs
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip python3 rsync ccache
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Set Git Config
        run: |
          git config --global user.name "MengBad"
          git config --global user.email "mengbad@qq.com"

      - name: Initialize TWRP Source Tree
        run: |
          mkdir twrp-source
          cd twrp-source
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          df -h

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp-source/device/xiaomi/dada

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Patch Platform Version Variables
        run: |
          echo "=== Locating version definition file via grep ==="
          grep_line=$(grep -rn "PLATFORM_VERSION :=" twrp-source/build/ | head -n 1)
          if [ -n "$grep_line" ]; then
            file_path=$(echo "$grep_line" | cut -d':' -f1)
            echo "Found version definition file at: $file_path"
            
            echo "=== Original Version Variables ==="
            grep -E "PLATFORM_VERSION\s*:=|PLATFORM_SDK_VERSION\s*:=" "$file_path" || true
            
            echo "=== Patching Version Variables ==="
            sed -i 's/^\s*PLATFORM_VERSION\s*:=\s*[0-9]*/PLATFORM_VERSION := 15/g' "$file_path"
            sed -i 's/^\s*PLATFORM_SDK_VERSION\s*:=\s*[0-9]*/PLATFORM_SDK_VERSION := 35/g' "$file_path"
            
            echo "=== Patched Version Variables ==="
            grep -E "PLATFORM_VERSION\s*:=|PLATFORM_SDK_VERSION\s*:=" "$file_path" || true
          else
            echo "ERROR: Could not locate version definition file inside twrp-source/build/!"
            exit 1
          fi

      - name: Patch libtar fscrypt v1/v2 compatibility
        run: |
          cd twrp-source
          APPEND_C="bootable/recovery/libtar/append.c"

          if [ -f "$APPEND_C" ]; then
            echo "=== Patching libtar fscrypt v1/v2 API compatibility ==="
            python3 << 'PYEOF'
import re

with open('bootable/recovery/libtar/append.c', 'r') as f:
    lines = f.readlines()

print(f"Total lines: {len(lines)}")

# Find all problematic fscrypt v1 blocks to disable
# Strategy: find 'fscrypt_policy_get_struct' line, go back to find the 'if (' that starts
# the block, then track braces to find the closing brace.
modified = False
i = 0
new_lines = []

while i < len(lines):
    line = lines[i]
    
    # Look for the fscrypt_policy_get_struct or lookup_ref_key (both v1-only patterns)
    if 'fscrypt_policy_get_struct' in line:
        # Find the start of the enclosing 'if' block (check current and previous lines)
        if_start_in_new = len(new_lines)
        # Look backwards in new_lines for 'if ('
        found_if = False
        for j in range(len(new_lines)-1, max(0, len(new_lines)-10), -1):
            if re.search(r'\bif\s*\(', new_lines[j]):
                if_start_in_new = j
                found_if = True
                break
        
        if not found_if:
            # If not found, insert #if 0 before current line
            new_lines.append('#if 0  /* disabled: fscrypt v1 API removed in vold v2 */\n')
            new_lines.append(line)
        else:
            # Insert #if 0 before the if statement in new_lines
            new_lines.insert(if_start_in_new, '#if 0  /* disabled: fscrypt v1 API removed in vold v2 */\n')
            new_lines.append(line)
        
        # Now consume lines until the closing brace of the if block
        brace_depth = 0
        while i < len(lines):
            current = lines[i]
            new_lines.append(current)
            brace_depth += current.count('{') - current.count('}')
            if brace_depth < 0:
                break
            if brace_depth == 0 and '{' in ''.join(lines[max(0,i-20):i+1]):
                break
            i += 1
        
        new_lines.append('#endif  /* fscrypt v1 disabled */\n')
        modified = True
        print(f"Disabled fscrypt block ending at line {i+1}")
    else:
        new_lines.append(line)
    
    i += 1

if modified:
    with open('bootable/recovery/libtar/append.c', 'w') as f:
        f.writelines(new_lines)
    print("Successfully patched libtar/append.c")
else:
    print("fscrypt_policy_get_struct not found - no patch needed")
PYEOF

            echo "=== Patching libtar build files for -Wno-error fallback ==="
            for MK in bootable/recovery/libtar/Android.mk bootable/recovery/libtar/Android.bp; do
              if [ -f "$MK" ]; then
                echo "Found: $MK"
                cat "$MK"
              fi
            done

            # Suppress Werror for libtar as a fallback safety net
            if [ -f "bootable/recovery/libtar/Android.mk" ]; then
              echo 'LOCAL_CFLAGS += -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion' \
                >> bootable/recovery/libtar/Android.mk
              echo "Added Wno-error flags to Android.mk"
            fi
          else
            echo "WARNING: libtar append.c not found at $APPEND_C"
            find bootable/ -name "append.c" 2>/dev/null || echo "No append.c found in bootable/"
          fi

      - name: Run TWRP Compilation
        run: |
          cd twrp-source
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_dada-ap2a-eng
          make ramdisk -j$(nproc --all)
          mkdir -p out/target/product/dada/root
          rsync -a out/target/product/dada/ramdisk/ out/target/product/dada/root/
          mkdir -p out/target/product/dada/root/linkerconfig
          make recoveryimage -j$(nproc --all)

      - name: Upload TWRP Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-dada-recovery
          path: twrp-source/out/target/product/dada/recovery.img
          if-no-files-found: error
