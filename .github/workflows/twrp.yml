name: Compile Custom TWRP for Xiaomi 15 (dada)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          
          echo "=== Purging large packages ==="
          sudo apt-get remove -y --purge snapd google-chrome-stable microsoft-edge-stable firefox || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          echo "=== Cleaning up large unused directories ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/rust
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /var/lib/snapd
          
          echo "=== Cleaning up docker images ==="
          sudo docker image prune -a -f
          
          echo "=== Disk Space After Cleanup ==="
          df -h

          echo "=== Creating 8GB Swap File ==="
          sudo swapon --show || true
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          sudo swapon --show || true
          free -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip python3 rsync ccache
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Set Git Config
        run: |
          git config --global user.name "MengBad"
          git config --global user.email "mengbad@qq.com"

      - name: Initialize TWRP Source Tree
        run: |
          mkdir twrp-source
          cd twrp-source
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          df -h

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp-source/device/xiaomi/dada

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Patch Platform Version Variables
        run: |
          echo "=== Locating version definition file via grep ==="
          grep_line=$(grep -rn "PLATFORM_VERSION :=" twrp-source/build/ | head -n 1)
          if [ -n "$grep_line" ]; then
            file_path=$(echo "$grep_line" | cut -d':' -f1)
            echo "Found version definition file at: $file_path"
            
            echo "=== Original Version Variables ==="
            grep -E "PLATFORM_VERSION\s*:=|PLATFORM_SDK_VERSION\s*:=" "$file_path" || true
            
            echo "=== Patching Version Variables ==="
            sed -i 's/^\s*PLATFORM_VERSION\s*:=\s*[0-9]*/PLATFORM_VERSION := 15/g' "$file_path"
            sed -i 's/^\s*PLATFORM_SDK_VERSION\s*:=\s*[0-9]*/PLATFORM_SDK_VERSION := 35/g' "$file_path"
            
            echo "=== Patched Version Variables ==="
            grep -E "PLATFORM_VERSION\s*:=|PLATFORM_SDK_VERSION\s*:=" "$file_path" || true
          else
            echo "ERROR: Could not locate version definition file inside twrp-source/build/!"
            exit 1
          fi

      - name: Patch libtar fscrypt v1/v2 compatibility
        run: |
          cd twrp-source
          echo "=== Patching libtar fscrypt v1/v2 API compatibility ==="
          python3 device/xiaomi/dada/patches/fix_libtar_fscrypt.py

          # Add -Wno-error fallback to libtar build files
          if [ -f "bootable/recovery/libtar/Android.mk" ]; then
            echo 'LOCAL_CFLAGS += -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion' \
              >> bootable/recovery/libtar/Android.mk
            echo "Added Wno-error flags to libtar Android.mk"
          fi
          if [ -f "bootable/recovery/libtar/Android.bp" ]; then
            echo "libtar Android.bp contents:"
            cat bootable/recovery/libtar/Android.bp
          fi

      - name: Run TWRP Compilation
        run: |
          cd twrp-source
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          export GOGC=50
          export GOMEMLIMIT=4GiB
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_dada-ap2a-eng
          make ramdisk -j$(nproc --all)
          mkdir -p out/target/product/dada/root
          rsync -a out/target/product/dada/ramdisk/ out/target/product/dada/root/
          mkdir -p out/target/product/dada/root/linkerconfig
          make recoveryimage -j$(nproc --all)

      - name: Upload TWRP Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-dada-recovery
          path: twrp-source/out/target/product/dada/recovery.img
          if-no-files-found: error
